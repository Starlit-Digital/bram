name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: python3 scripts/test-local-install.py
      - run: python3 scripts/test-grok-mailbox.py
